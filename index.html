<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xmart Operations Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    /* CSS 樣式與原版完全相同，完美保留您的所有美編排版 */
    :root { --color-primary: #6a1b9a; --color-primary-dark: #4a148c; --color-success: #15803d; --radius-md: 12px; --radius-sm: 10px; }
    body { padding-top: 20px; padding-bottom: 80px; background-color: #0c0718; color: #1f2937; font-family: sans-serif; min-height: 100vh; }
    body::before { content: ""; position: fixed; top: -15%; left: -15%; width: 130%; height: 130%; background: radial-gradient(circle at 18% 18%, rgba(147, 51, 234, 0.5) 0%, transparent 45%), radial-gradient(circle at 82% 22%, rgba(236, 72, 153, 0.4) 0%, transparent 40%), radial-gradient(circle at 50% 70%, rgba(126, 34, 206, 0.45) 0%, transparent 50%); filter: blur(50px); z-index: -2; }
    .card { border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.6); }
    .btn-primary { background-color: var(--color-primary); border-color: var(--color-primary); color: white; font-weight: bold; }
    .hidden { display: none !important; }
    .issue-item { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 15px; }
    #fullscreenOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
    #fullscreenOverlay.show { display: flex !important; }
    /* ... 其餘樣式省略，與您上個版本完全一致 ... */
  </style>
</head>
<body>

  <!-- 全螢幕讀取畫面 -->
  <div id="fullscreenOverlay">
    <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;"></div>
    <h5 id="overlayText" class="fw-bold text-primary">系統連線中...</h5>
  </div>

  <div class="container" style="max-width: 600px;">
    <div class="text-center mb-4 mt-2">
      <img src="https://www.xmart-group.com/storage/2025/04/logo-1.png" alt="Logo" style="max-height:80px; margin-bottom:15px;">
      <h4 class="fw-bold text-white">📋 HQ-Store Operations Hub</h4>
    </div>

    <!-- 系統主畫面 (簡化展示結構) -->
    <div id="mainSystem" class="hidden card p-3">
      <div class="d-flex mb-3 gap-2">
        <button class="btn btn-primary w-100" onclick="switchMode('new')">➕ 新增巡檢</button>
        <button class="btn btn-success w-100" onclick="switchMode('update')">🔄 更新進度</button>
      </div>

      <!-- 新增區塊 -->
      <div id="newSection">
        <select id="newStoreSelect" class="form-select mb-3"></select>
        <div id="issueContainer">
          <div class="issue-item">
            <label>類別</label><select class="form-select mb-2 category-input"></select>
            <label>描述</label><textarea class="form-control mb-2 desc-input"></textarea>
            <!-- 檔案上傳 UI -->
          </div>
        </div>
        <button class="btn btn-primary w-100" onclick="submitNew()">📤 送出</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🌐 核心 API 設定 (前後端分離關鍵)
    // ==========================================
    const LIFF_ID = "2011299031-XyatqEOs"; // 您的 LIFF ID
    const LIFF_URL = "https://liff.line.me/" + LIFF_ID;
    
    // 🚀 未來的 GAS Web App 網址將填入這裡
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyhTINfMK_pxjBS1PDNz0sI9wfK_e_dj4yMreHMiGiciFFhKBQ2PfBYo14djV0OZVOL/exec"; 

    // 全域變數緩存
    let globalSystemData = { stores: [], categories: [], vendors: [] };
    let currentUser = null;

    // ==========================================
    // 🔄 共用 Fetch API 封裝 (取代 google.script.run)
    // ==========================================
    async function callGasAPI(action, payload = {}) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, // GAS 跨域必備 header
          body: JSON.stringify({ action: action, data: payload })
        });
        const result = await response.json();
        if (result.status === "error") throw new Error(result.message);
        return result.data;
      } catch (error) {
        console.error("API 呼叫失敗:", error);
        throw error;
      }
    }

    // ==========================================
    // 🚀 系統初始化
    // ==========================================
    window.onload = async function() {
      // 1. 初始化 LIFF
      await liff.init({ liffId: LIFF_ID });
      
      if (!liff.isLoggedIn() && liff.isInClient()) {
        liff.login();
        return;
      }

      showOverlay("正在載入系統資料...");
      try {
        // 2. 向 GAS 請求初始環境資料 (門市、類別、廠商、使用者權限)
        const lineUserId = liff.isLoggedIn() ? (await liff.getProfile()).userId : "GUEST_WEB";
        
        const initData = await callGasAPI("initializeSystem", { lineUserId: lineUserId });
        globalSystemData = initData.system; // { stores: [...], categories: [...], vendors: [...] }
        
        if (initData.user.isRegistered) {
          currentUser = initData.user;
          setupUI();
        } else {
          // 顯示註冊畫面
          console.log("需引導註冊");
        }
      } catch (e) {
        alert("系統連線失敗，請確認 GAS API 網址是否正確。");
      } finally {
        hideOverlay();
      }
    };

    function setupUI() {
      document.getElementById('mainSystem').classList.remove('hidden');
      // 動態渲染下拉選單 (使用 globalSystemData)
    }

    function showOverlay(text) {
      document.getElementById('overlayText').innerText = text;
      document.getElementById('fullscreenOverlay').classList.add('show');
    }
    function hideOverlay() {
      document.getElementById('fullscreenOverlay').classList.remove('show');
    }

    // ==========================================
    // 🚀 新增巡檢與滿血版 Flex Message 分享
    // ==========================================
    async function submitNew() {
      const store = document.getElementById('newStoreSelect').value;
      const issues = [{ category: "環境清潔", desc: "測試", photosCount: 0 }]; // 範例抓取
      
      showOverlay("處理中...");
      try {
        // 呼叫改裝後的 GAS API
        const result = await callGasAPI("submitNewIssues", {
          store: store,
          issues: issues,
          empName: currentUser.empName
        });
        
        hideOverlay();

        // 滿血復活的 LINE 官方卡片分享機制！
        if (liff.isApiAvailable('shareTargetPicker')) {
          liff.shareTargetPicker([{
            "type": "flex",
            "altText": "🚨 門市異常回報通知",
            "contents": {
              "type": "bubble",
              "size": "mega",
              "body": {
                "type": "box",
                "layout": "vertical",
                "contents": [
                  { "type": "text", "text": "🚨 New Issue / 門市巡檢與報修", "weight": "bold", "color": "#dc3545" },
                  { "type": "text", "text": "📍 門市：" + store },
                  { "type": "text", "text": "📝 問題：" + issues[0].desc, "wrap": true }
                ]
              },
              "footer": {
                "type": "box",
                "layout": "vertical",
                "contents": [{
                  "type": "button",
                  "style": "primary",
                  "color": "#6a1b9a",
                  "action": { "type": "uri", "label": "Open / 開啟系統", "uri": LIFF_URL }
                }]
              }
            }
          }]).then(() => {
            alert("✅ 新增且分享成功！");
          }).catch(console.error);
        } else {
          alert("✅ 新增成功！(此環境不支援 LINE 轉傳)");
        }

      } catch (e) {
        hideOverlay();
        alert("送出失敗：" + e.message);
      }
    }
  </script>
</body>
</html>
