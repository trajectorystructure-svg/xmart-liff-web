<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xmart 門市與總部雙向營運協作平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    :root {
      --radius-lg: 20px; --radius-md: 12px; --radius-sm: 10px; --radius-pill: 50rem;
      --color-primary: #6a1b9a; --color-primary-dark: #4a148c; --color-success: #15803d;
      --color-text-main: #1f2937; --color-text-muted: #6b7280; --color-border-light: #e5e7eb;
      --font-size-h1: 1.25rem; --font-size-h2: 1rem; --font-size-body: 0.9rem; --font-size-sm: 0.78rem; 
    }
    body { 
      padding: calc(20px + env(safe-area-inset-top)) calc(15px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(15px + env(safe-area-inset-left));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
      min-height: 100vh; background-color: #0c0718; color: var(--color-text-main);
    }
    body::before {
      content: ""; position: fixed; top: -15%; left: -15%; width: 130%; height: 130%;
      background: radial-gradient(circle at 18% 18%, rgba(147, 51, 234, 0.5) 0%, transparent 45%), radial-gradient(circle at 82% 22%, rgba(236, 72, 153, 0.4) 0%, transparent 40%), radial-gradient(circle at 50% 70%, rgba(126, 34, 206, 0.45) 0%, transparent 50%); filter: blur(50px); z-index: -2;
    }
    .lang-pill-box { display: inline-flex; background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: var(--radius-pill); padding: 3px; }
    .lang-btn { border: none; background: transparent; color: rgba(255, 255, 255, 0.8); font-size: var(--font-size-sm); font-weight: 700; padding: 5px 16px; border-radius: var(--radius-pill); cursor: pointer; }
    .lang-btn.active { background: var(--color-primary); color: #ffffff; }
    .btn { border-radius: var(--radius-sm) !important; font-weight: 700; }
    .btn-primary { background-color: var(--color-primary); border-color: var(--color-primary); color: white; }
    .btn-success { background-color: #ffca28; border-color: #ffca28; color: #212529; }
    .card { border-radius: var(--radius-lg) !important; background: rgba(255, 255, 255, 0.85) !important; backdrop-filter: blur(20px); }
    .issue-item, .update-item, .readonly-item { margin-bottom: 16px; border-radius: var(--radius-md) !important; background: #ffffff !important; padding: 15px; border: 1px solid #e5e7eb;}
    .form-label { font-weight: 700; margin-bottom: 6px; font-size: 0.9rem;}
    .form-select, .form-control { border-radius: var(--radius-sm) !important; }
    .preview-gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .preview-thumb-box { position: relative; width: 88px; height: 88px; border-radius: var(--radius-sm); overflow: hidden; }
    .preview-thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    .remove-photo-badge { position: absolute; top: 4px; right: 4px; background: rgba(220, 38, 38, 0.9); color: #ffffff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
    .pill-opt { padding: 6px 14px; border-radius: var(--radius-pill) !important; border: 1px solid rgba(206, 147, 216, 0.4); cursor: pointer; font-size: 0.85rem;}
    .pill-opt.active { background-color: var(--color-primary) !important; color: #ffffff !important; }
    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1060; width: 90%; max-width: 400px; }
    .custom-toast { padding: 12px; border-radius: var(--radius-md); color: white; font-weight: bold; text-align: center; opacity: 0; transition: opacity 0.3s; }
    .custom-toast.show { opacity: 1; }
    .toast-success { background-color: var(--color-primary); }
    .toast-error { background-color: #dc3545; }
    #fullscreenOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(255, 255, 255, 0.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
    #fullscreenOverlay.show { display: flex !important; }
    .hidden { display: none !important; }
    .hq-repair-section { background-color: rgba(255, 243, 224, 0.85); border: 1.5px dashed #ffb300; border-radius: var(--radius-md); padding: 15px; margin-top: 15px; }
    .company-logo { max-height: 80px; margin-bottom: 15px; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .shake-invalid { animation: shake 0.3s ease-in-out !important; border-color: #dc2626 !important; }
    .micro-dashboard { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: var(--radius-md) !important; padding: 12px; }
    .dash-stat-card { border-radius: var(--radius-sm) !important; padding: 10px 8px !important; }
    .dash-num { font-size: 1.5rem !important; line-height: 1.2 !important; font-weight: 800 !important; }
    .dash-label { font-size: var(--font-size-sm) !important; font-weight: 700 !important; }
    .skeleton-card { border-radius: var(--radius-md); padding: 20px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.8); height: 120px; }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="lightboxOverlay" onclick="closeLightbox()" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:10000;display:none;justify-content:center;align-items:center;">
    <img id="lightboxImg" src="" style="max-width:92%;max-height:88%;border-radius:12px;">
  </div>
  <div id="fullscreenOverlay">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;margin-bottom:15px;"></div>
    <h5 id="overlayText" class="fw-bold text-primary">System Booting...</h5>
    <div class="progress mt-3" style="width: 75%; height: 20px; border-radius: 10px;">
      <div id="overlayProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 100%;"></div>
    </div>
  </div>
  
  <div class="container" style="max-width: 600px;">
    <div class="text-center mb-4 mt-2">
      <img src="https://www.xmart-group.com/storage/2025/04/logo-1.png" alt="Logo" class="company-logo">
      <h4 class="fw-bold mb-1 text-white">📋 HQ-Store Operations Hub</h4>
      <div class="d-flex justify-content-center mt-2">
        <div class="lang-pill-box">
          <button type="button" id="langBtnEn" class="lang-btn active" onclick="setLanguage('en')">EN</button>
          <button type="button" id="langBtnZh" class="lang-btn" onclick="setLanguage('zh')">繁體</button>
        </div>
      </div>
    </div>
    
    <div id="loginSection" class="card p-4 text-center hidden">
      <h5 class="fw-bold text-primary mb-2" data-zh="首次使用帳號開通">Initial Setup</h5>
      <p class="text-muted small mb-3" data-zh="請輸入姓名並選擇您負責的門市：">Please set your name and store(s).</p>
      <input type="text" id="regNameInput" class="form-control mb-3 text-center fw-bold" placeholder="Your Name / 請輸入姓名">
      <div id="storeCheckboxGroup" class="d-flex flex-wrap gap-2 mb-3"></div>
      <div class="form-check text-start mb-3 ms-1">
        <input class="form-check-input" type="checkbox" id="isHqCheckbox">
        <label class="form-check-label small text-muted fw-bold" for="isHqCheckbox" data-zh="我是總部人員 (HQ Staff)">I am HQ Staff</label>
      </div>
      <button type="button" id="loginBtn" class="btn btn-primary w-100 fw-bold" onclick="submitRegistration()" data-zh="完成設定並開啟">Complete Setup</button>
    </div>
    
    <div id="mainSystem" class="hidden">
      <div class="alert alert-info d-flex justify-content-between align-items-center mb-3 p-2 px-3 shadow-sm">
        <div><strong id="displayEmpName" class="text-dark">Loading...</strong><small id="displayStoreName" class="text-muted ms-1"></small></div>
        <button type="button" class="btn btn-sm btn-outline-danger px-2 py-1" onclick="resetAccount()">🔄 重設</button>
      </div>
      
      <div class="d-flex mb-4 gap-2">
        <button type="button" class="btn btn-primary flex-fill" onclick="switchMode('new')" data-zh="➕ 新增巡檢">➕ Add</button>
        <button type="button" class="btn btn-success flex-fill" onclick="switchMode('update')" data-zh="🔄 更新進度">🔄 Update</button>
      </div>
      
      <!-- 新增區塊 -->
      <div id="newSection" class="card p-3 hidden">
        <div id="newStoreSelectWrapper"><select id="newStoreSelect" class="form-select mb-3 shadow-sm"></select></div>
        <div id="issueContainer">
          <div class="issue-item">
            <label class="form-label text-dark" data-zh="類別">Category</label>
            <select class="form-select mb-3 category-input"><option>Loading...</option></select>
            <label class="form-label text-dark" data-zh="具體問題描述 *">Issue Description *</label>
            <textarea class="form-control mb-3 desc-input" rows="2" placeholder="Required..."></textarea>
            <label class="form-label text-dark" data-zh="現場照片 (最多 3 張)">On-site Photos (Max 3)</label>
            <div class="photo-upload-wrapper mb-2">
              <div class="d-flex gap-2 mb-2">
                <button type="button" class="btn btn-sm btn-outline-primary flex-fill" onclick="triggerPhotoInput(this, 'camera')">📷 拍照</button>
                <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="triggerPhotoInput(this, 'album')">🖼️ 相簿</button>
              </div>
              <input type="file" class="photo-input hidden" accept="image/*" multiple onchange="handleMultiPhotoSelect(this)">
              <div class="preview-gallery"></div>
            </div>
            <div class="text-end"><button type="button" class="btn btn-sm btn-outline-danger remove-btn hidden" onclick="removeIssueRow(this)">🗑️ 移除</button></div>
          </div>
        </div>
        <div id="newSectionControls">
          <button type="button" class="btn btn-outline-primary mb-3 w-100 fw-bold" onclick="addIssueRow()" data-zh="➕ 新增下一筆異常">➕ Add Next Issue</button>
          <button type="button" id="submitNewBtn" class="btn btn-primary w-100 py-2 shadow" onclick="submitNew()" data-zh="📤 送出所有異常">📤 Submit All Issues</button>
        </div>
      </div>
      
      <!-- 更新區塊 -->
      <div id="updateSection" class="card p-3 hidden">
        <select id="updateStoreSelect" class="form-select mb-3 shadow-sm" onchange="fetchPending()"></select>
        <div id="pendingContainer"><div class="text-center p-3 text-muted">Please select a store.</div></div>
        <button type="button" id="saveUpdateBtn" class="btn btn-success w-100 shadow mt-3 hidden" onclick="submitUpdates()" data-zh="💾 儲存進度更新">💾 Save Updates</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 已自動填入您發布的正式 Google Apps Script Web App API 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyhTINfMK_pxjBS1PDNz0sI9wfK_e_dj4yMreHMiGiciFFhKBQ2PfBYo14djV0OZVOL/exec"; 
    const LIFF_ID = "2011299031-XyatqEOs"; 
    // =========================================================================

    const LIFF_URL = "https://liff.line.me/" + LIFF_ID;
    let globalPendingData = null, lastSharePayload = null, currentUser = { empName: "", store: "", isHQ: false }, lineProfile = null;
    let rawStoreDataHtml = "", rawVendorDataHtml = "", categoryOptionsHtml = "";
    let currentLang = safeGetStorage('xmart_lang') || 'zh';

    const catDict = { "設備與系統異常":{en:"Equipment & System",zh:"設備與系統異常"}, "環境清潔":{en:"Environmental Cleaning",zh:"環境清潔"}, "定期消毒":{en:"Regular Disinfection",zh:"定期消毒"}, "人員紀律":{en:"Personnel Discipline",zh:"人員紀律"}, "商品陳列":{en:"Merchandising & Display",zh:"商品陳列"}, "商品陳列與標示":{en:"Merchandising & Display",zh:"商品陳列與標示"}, "食品安全":{en:"Food Safety",zh:"食品安全"}, "客訴處理":{en:"Customer Complaint",zh:"客訴處理"}, "其他":{en:"Other",zh:"其他"} };
    const statDict = { "未處理":{en:"Pending",zh:"未處理"}, "已聯繫/待派工":{en:"Contacted",zh:"已聯繫/待派工"}, "已排程":{en:"Scheduled",zh:"已排程"}, "觀察中":{en:"Observing",zh:"觀察中"}, "處理中":{en:"Processing",zh:"處理中"}, "已結案":{en:"Closed",zh:"已結案"} };
    const i18n = { en:{ noPen:"🎉 No pending issues!", pen:"🚨 Pending", pro:"⏳ Progress", tot:"📋 Total", errLoad:"Load failed", noP:"No photo", hqDet:"🛠️ HQ Details", hqB:"HQ Only", urg:"Urgent", eqN:"Equipment", ven:"Vendor", rLog:"Log", mat:"Materials", war:"Warranty", pri:"Price", total:"Total", uP:"Completion Photos", st:"Status", prog:"Progress", reqC:"*Required" }, zh:{ noPen:"🎉 無待處理案件！", pen:"🚨 待處理", pro:"⏳ 處理中", tot:"📋 總件數", errLoad:"載入失敗", noP:"無附照片", hqDet:"🛠️ 總部維修專區", hqB:"總部專用", urg:"嚴重影響營運", eqN:"設備名稱", ven:"廠商聯絡人", rLog:"維修紀錄", mat:"使用耗材", war:"保固時間", pri:"未稅金額", total:"總計金額", uP:"完工照片", st:"處理狀態", prog:"處理進度", reqC:"*必填" } };

    function safeGetStorage(k) { try{ return localStorage.getItem(k); }catch(e){ return null; } }
    function safeSetStorage(k, v) { try{ localStorage.setItem(k, v); }catch(e){} }
    function setLanguage(l) {
      currentLang = l; safeSetStorage('xmart_lang', l);
      document.getElementById('langBtnEn').classList.toggle('active', l==='en'); document.getElementById('langBtnZh').classList.toggle('active', l==='zh');
      document.querySelectorAll('[data-zh]').forEach(el => el.innerText = l === 'en' ? (el.getAttribute('data-en')||el.innerText) : el.getAttribute('data-zh'));
      document.querySelectorAll('.category-input').forEach(sel => {
        Array.from(sel.options).forEach(opt => { if(opt.value) { let k = opt.value.split('/')[0].trim(); if(catDict[k]) opt.text = catDict[k][l] || k; } });
      });
      if(document.getElementById('pendingContainer') && globalPendingData && document.getElementById('updateStoreSelect').value) renderPendingData(document.getElementById('updateStoreSelect').value, globalPendingData);
    }

    // 🚀 REST API 通訊核心：使用 text/plain 防範跨網域 CORS OPTIONS 預檢阻擋
    async function apiCall(action, params = {}) {
      params.action = action;
      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(params)
        });
        const json = await res.json();
        if (json.status === 'error') throw new Error(json.message);
        return json.data;
      } catch (err) { throw new Error("API 傳輸失敗: " + err.message); }
    }

    window.onload = async function() {
      setLanguage(currentLang);
      document.getElementById('fullscreenOverlay').classList.add('show');
      
      try {
        // 1. 初始化拉取選單資料
        const initData = await apiCall('getInitialData');
        rawStoreDataHtml = initData.storeOptions;
        rawVendorDataHtml = initData.vendorOptions;
        categoryOptionsHtml = initData.categoryOptions;
        document.querySelectorAll('.category-input').forEach(el => el.innerHTML = categoryOptionsHtml);
        
        // 2. 初始化 LIFF 與權限
        await liff.init({ liffId: LIFF_ID });
        const cached = safeGetStorage('xmart_cached_user');
        
        if (liff.isLoggedIn()) {
          lineProfile = await liff.getProfile();
          const authRes = await apiCall('checkLineUserRegistration', { lineUserId: lineProfile.userId });
          if (authRes && authRes.isRegistered) {
            currentUser = authRes; safeSetStorage('xmart_cached_user', JSON.stringify(authRes));
            applyUserToUI(authRes); preloadData();
          } else { showLogin(); }
        } else if (cached) {
          try { currentUser = JSON.parse(cached); applyUserToUI(currentUser); preloadData(); } catch(e){ showLogin(); }
        } else {
          if (!liff.isInClient()) { showLogin(); } else { liff.login({ redirectUri: LIFF_URL }); }
        }
        hideOverlay();
      } catch (err) {
        showError("系統連線失敗，請確認 GAS API 網址與存取權限。 " + err.message);
      }
    };

    function showLogin() {
      renderStoreCheckboxes();
      document.getElementById('mainSystem').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }

    function applyUserToUI(user) {
      document.getElementById('displayEmpName').innerText = user.empName;
      document.getElementById('displayStoreName').innerText = user.store ? "(" + user.store + ")" : "";
      document.getElementById('loginSection').classList.add('hidden'); document.getElementById('mainSystem').classList.remove('hidden');
      const opts = user.isHQ ? rawStoreDataHtml : user.store.split(',').map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
      document.getElementById('newStoreSelect').innerHTML = opts; document.getElementById('updateStoreSelect').innerHTML = opts;
      if (!user.isHQ && user.store.split(',').length === 1) {
        document.getElementById('newStoreSelectWrapper').classList.add('hidden'); document.getElementById('updateStoreSelectWrapper').classList.add('hidden');
      } else { document.getElementById('newStoreSelectWrapper').classList.remove('hidden'); document.getElementById('updateStoreSelectWrapper').classList.remove('hidden'); }
    }

    function renderStoreCheckboxes() {
      const container = document.getElementById('storeCheckboxGroup'); if (!rawStoreDataHtml) return;
      const t = document.createElement('div'); t.innerHTML = rawStoreDataHtml; let s = [];
      t.querySelectorAll('option').forEach(o => { if(o.value) s.push(o.value); });
      container.innerHTML = s.map(v => `<div class="pill-opt store-pill mb-1" onclick="this.classList.toggle('active')" data-value="${v}">${v}</div>`).join('');
    }

    async function submitRegistration() {
      const name = document.getElementById('regNameInput').value.trim();
      const stores = Array.from(document.querySelectorAll('#storeCheckboxGroup .store-pill.active')).map(p => p.getAttribute('data-value'));
      const isHQ = document.getElementById('isHqCheckbox').checked;
      if (!name || (stores.length === 0 && !isHQ)) return showToast("資料不完整", "error");
      
      document.getElementById('loginBtn').disabled = true; document.getElementById('loginBtn').innerText = "設定中...";
      try {
        const userId = lineProfile ? lineProfile.userId : ("GUEST_" + Math.floor(Math.random()*1000));
        const res = await apiCall('registerNewUser', { lineUserId: userId, empName: name, storesArray: stores, isHQ: isHQ });
        if (res.success) { currentUser = res; safeSetStorage('xmart_cached_user', JSON.stringify(res)); applyUserToUI(res); showToast("成功！"); preloadData(); }
      } catch(e) { showToast(e.message, "error"); document.getElementById('loginBtn').disabled = false; document.getElementById('loginBtn').innerText = "Complete Setup"; }
    }
    
    async function resetAccount() {
      if (confirm("確定重設帳號嗎？")) {
        localStorage.removeItem('xmart_cached_user'); showOverlay("Resetting...", 50);
        try { await apiCall('deleteUserRegistration', { lineUserId: lineProfile ? lineProfile.userId : "" }); location.reload(); } catch(e) { location.reload(); }
      }
    }

    function switchMode(mode) {
      document.getElementById('newSection').classList.toggle('hidden', mode !== 'new'); document.getElementById('updateSection').classList.toggle('hidden', mode !== 'update');
      if (mode === 'update') fetchPending();
    }

    async function preloadData() { try { globalPendingData = await apiCall('getAllPendingIssues'); } catch(e){} }
    function showToast(msg, type='success') { const t = document.createElement('div'); t.className = `custom-toast toast-${type} mb-2`; t.innerText = msg; document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.classList.add('show'),10); setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),300)}, 3000); }
    function markInvalidField(el) { el.classList.add('shake-invalid'); setTimeout(()=>el.classList.remove('shake-invalid'), 600); }
    function showError(err) { showToast(err.message || err, 'error'); hideOverlay(); }
    function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightboxOverlay').style.display = 'flex'; }
    function closeLightbox() { document.getElementById('lightboxOverlay').style.display = 'none'; }

    function triggerPhotoInput(btn, mode) {
      const item = btn.closest('.issue-item') || btn.closest('.update-item') || btn.closest('.hq-repair-section');
      if (item._photos && item._photos.length >= 3) return showToast("最多 3 張", "error");
      const input = item.querySelector('input[type="file"]');
      mode === 'camera' ? input.setAttribute('capture', 'environment') : input.removeAttribute('capture'); input.click();
    }
    function handleMultiPhotoSelect(input) {
      const item = input.closest('.issue-item') || input.closest('.update-item') || input.closest('.hq-repair-section');
      if (!item._photos) item._photos = []; Array.from(input.files).forEach(f => { if (item._photos.length < 3) item._photos.push(f); });
      input.value = ""; renderGallery(item);
    }
    function renderGallery(item) {
      const gal = item.querySelector('.preview-gallery'); gal.innerHTML = "";
      (item._photos || []).forEach((f, i) => {
        const box = document.createElement('div'); box.className = 'preview-thumb-box';
        const img = document.createElement('img'); const reader = new FileReader(); reader.onload = e => img.src = e.target.result; reader.readAsDataURL(f); img.onclick = ()=>openLightbox(img.src);
        const del = document.createElement('div'); del.className = 'remove-photo-badge'; del.innerText = 'X'; del.onclick = (e) => { e.stopPropagation(); item._photos.splice(i, 1); renderGallery(item); };
        box.append(img, del); gal.appendChild(box);
      });
    }

    function compressImage(file) {
      return new Promise((res, rej) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = e => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            let w = img.width, h = img.height; if (w > 1024 || h > 1024) { if (w > h) { h *= 1024/w; w = 1024; } else { w *= 1024/h; h = 1024; } }
            const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h; cvs.getContext('2d').drawImage(img, 0, 0, w, h); res(cvs.toDataURL('image/jpeg', 0.7));
          }; img.onerror = rej;
        }; reader.onerror = rej;
      });
    }

    function calculateTotal(elem) {
      const item = elem.closest('.hq-repair-section') || elem.closest('.update-item');
      const price = parseFloat(item.querySelector('.price-input').value) || 0; 
      item.querySelector('.total-input').value = (item.querySelector('.tax-checkbox') && item.querySelector('.tax-checkbox').checked) ? Math.round(price * 1.05) : price;
    }

    function addIssueRow() {
      const first = document.querySelector('.issue-item'); const clone = first.cloneNode(true);
      clone._photos = []; clone.querySelectorAll('textarea').forEach(t=>t.value=''); clone.querySelector('.category-input').innerHTML = categoryOptionsHtml;
      clone.querySelector('.preview-gallery').innerHTML = ''; clone.querySelector('.remove-btn').classList.remove('hidden'); document.getElementById('issueContainer').appendChild(clone);
      setLanguage(currentLang);
    }
    function removeIssueRow(btn) { btn.closest('.issue-item').remove(); }
    
    function showOverlay(txt, pct) { document.getElementById('overlayText').innerText = txt; document.getElementById('overlayProgressBar').style.width = pct+'%'; document.getElementById('overlayProgressBar').innerText = pct+'%'; document.getElementById('fullscreenOverlay').classList.add('show'); }
    function hideOverlay() { document.getElementById('fullscreenOverlay').classList.remove('show'); }

    function triggerLineShare() {
      if (!liff.isApiAvailable('shareTargetPicker')) return showToast("環境不支援分享", "error");
      liff.shareTargetPicker([lastSharePayload]).then(res => { if(res) showToast("已分享！", "success"); }).catch(console.error);
    }

    function resetNewForm() {
      document.getElementById('newStoreSelectWrapper').classList.remove('hidden'); document.getElementById('newSectionControls').classList.remove('hidden');
      const container = document.getElementById('issueContainer'); const first = container.querySelector('.issue-item').cloneNode(true);
      first._photos = []; first.querySelectorAll('textarea').forEach(t=>t.value=''); first.querySelector('.category-input').innerHTML = categoryOptionsHtml;
      first.querySelector('.preview-gallery').innerHTML = ''; first.querySelector('.remove-btn').classList.add('hidden');
      container.innerHTML = ''; container.appendChild(first); setLanguage(currentLang);
    }

    async function submitNew() {
      const store = document.getElementById('newStoreSelect').value; if (!store) return showToast("請選擇門市", "error");
      const items = document.querySelectorAll('.issue-item');
      for (let i=0; i<items.length; i++) { if (!items[i].querySelector('.desc-input').value.trim()) return showToast("請填寫描述", "error"); }
      document.getElementById('submitNewBtn').disabled = true; showOverlay("處理中...", 20);
      try {
        const issues = []; const photoBatch = [];
        items.forEach(item => { issues.push({ category: item.querySelector('.category-input').value, desc: item.querySelector('.desc-input').value, photosCount: (item._photos||[]).length }); });
        
        showOverlay("寫入資料庫...", 40);
        const res = await apiCall('submitNewIssuesText', { store: store, issues: issues, empName: currentUser.empName });
        
        for (let i = 0; i < items.length; i++) {
          const photos = items[i]._photos || [];
          if (photos.length > 0) {
            const comp = []; for (let p=0; p<photos.length; p++) { showOverlay(`壓縮照片 ${p+1}...`, 50); comp.push(await compressImage(photos[p])); }
            photoBatch.push({ eventId: res.eventIds[i].id, photos: comp, targetSheetName: res.eventIds[i].targetSheetName, targetRowIdx: res.eventIds[i].targetRowIdx });
          }
        }
        
        if (photoBatch.length > 0) {
          showOverlay("上傳照片中...", 85);
          await apiCall('uploadPhotosInBackground', { submissionMeta: {store:store, issues:issues, empName:currentUser.empName}, photoBatchArray: photoBatch });
        }
        
        showOverlay("完成！", 100);
        setTimeout(() => {
          var sName = store.includes(' / ') ? store.split(' / ')[1] : store;
          lastSharePayload = {
            "type": "flex", "altText": "🚨 門市異常回報",
            "contents": {
              "type": "bubble", "size": "mega",
              "body": { "type": "box", "layout": "vertical", "spacing": "md", "contents": [
                { "type": "text", "text": "🚨 門市異常回報", "weight": "bold", "color": "#dc3545" },
                { "type": "text", "text": "📍 門市：" + sName, "size": "sm" },
                { "type": "text", "text": "📝 描述：" + issues[0].desc, "size": "sm", "wrap": true }
              ]}, "footer": { "type": "box", "layout": "vertical", "contents": [{ "type": "button", "style": "primary", "action": { "type": "uri", "label": "開啟系統", "uri": LIFF_URL } }] }
            }
          };
          document.getElementById('newStoreSelectWrapper').classList.add('hidden'); document.getElementById('newSectionControls').classList.add('hidden');
          document.getElementById('issueContainer').innerHTML = `<div class="text-center p-4 border rounded" style="background: rgba(255,255,255,0.9);"><div style="font-size: 3rem;">✅</div><h5 class="fw-bold text-success mt-2">新增成功！</h5><button class="btn btn-success w-100 mt-3 mb-2" onclick="triggerLineShare()">📢 分享至 LINE 群組</button><button class="btn btn-outline-primary w-100" onclick="resetNewForm()">➕ 繼續新增</button></div>`;
          hideOverlay(); document.getElementById('submitNewBtn').disabled = false; preloadData();
        }, 500);
      } catch(e) { document.getElementById('submitNewBtn').disabled = false; showError(e); }
    }
    
    function fetchPending() {
      const store = document.getElementById('updateStoreSelect').value; if(!store) { document.getElementById('saveUpdateBtn').classList.add('hidden'); return; }
      document.getElementById('pendingContainer').innerHTML = `<div class="skeleton-card"></div>`; document.getElementById('saveUpdateBtn').classList.add('hidden');
      if (globalPendingData) renderPendingData(store, globalPendingData); else { apiCall('getAllPendingIssues').then(data => { globalPendingData = data; renderPendingData(store, data); }).catch(showError); }
    }
    
    function selectStatusPill(pillElem, val) {
      const wrapper = pillElem.parentNode; wrapper.querySelectorAll('.pill-opt').forEach(p => p.classList.remove('active'));
      pillElem.classList.add('active'); wrapper.parentNode.querySelector('.status-input').value = val;
    }

    function renderPendingData(store, allData) {
      const l = i18n[currentLang]; var sName = store.includes(' / ') ? store.split(' / ')[1].trim() : store; var issues = allData.filter(i => i.store.includes(sName));
      if(issues.length === 0) return document.getElementById('pendingContainer').innerHTML = `<div class="alert alert-success text-center mt-3 shadow-sm" style="background:#ffca28;color:#212529;"><h5>${l.noPen}</h5></div>`; 
      let html = `<div class="micro-dashboard row g-2 text-center mb-4"><div class="col-4"><div class="dash-stat-card" style="background:#fef2f2;"><div class="dash-num text-danger">${issues.filter(i=>i.status==='未處理').length}</div><div class="dash-label text-dark">${l.pen}</div></div></div><div class="col-4"><div class="dash-stat-card" style="background:#fffbeb;"><div class="dash-num text-warning">${issues.filter(i=>i.status!=='未處理'&&i.status!=='已結案').length}</div><div class="dash-label text-dark">${l.pro}</div></div></div><div class="col-4"><div class="dash-stat-card" style="background:#f3e8ff;"><div class="dash-num text-primary">${issues.length}</div><div class="dash-label text-dark">${l.tot}</div></div></div></div>`;
      let hasUpdatable = false;
      
      issues.forEach((iss, idx) => {
        let phtml = iss.fileId ? `<div class="text-center mb-3" id="photo-${iss.eventId}"><div class="spinner-border spinner-border-sm"></div></div>` : `<div class="alert alert-secondary text-center p-2 small mb-3">${l.noP}</div>`;
        let isRep = iss.sheetName === '設備報修紀錄' || iss.category.includes("設備與系統異常"); let isRO = isRep && !currentUser.isHQ; let hqHtml = '';
        
        if (isRep && currentUser.isHQ) {
          let vOpt = rawVendorDataHtml; if (rawVendorDataHtml.includes(`value="${iss.vendor}"`)) vOpt = rawVendorDataHtml.replace(`value="${iss.vendor}"`, `value="${iss.vendor}" selected`); else if (iss.vendor) vOpt += `<option value="${iss.vendor}" selected>${iss.vendor}</option>`;
          hqHtml = `<div class="hq-repair-section shadow-sm"><h6 class="fw-bold mb-3">${l.hqDet} <span class="badge bg-danger rounded-pill">${l.hqB}</span></h6><div class="form-check form-switch mb-3"><input class="form-check-input severity-input" type="checkbox" ${iss.severity?'checked':''}><label class="fw-bold text-danger">${l.urg}</label></div><label class="small fw-bold">${l.eqN}</label><input type="text" class="form-control mb-2 equip-input" value="${iss.equipName}"><label class="small fw-bold">${l.ven}</label><select class="form-select mb-2 vendor-input">${vOpt}</select><label class="small fw-bold">${l.rLog}</label><textarea class="form-control mb-2 repair-desc-input" rows="2">${iss.repairDesc}</textarea><label class="small fw-bold">${l.mat}</label><input type="text" class="form-control mb-2 materials-input" value="${iss.materials||''}"><label class="small fw-bold">${l.war}</label><input type="text" class="form-control mb-2 warranty-input" value="${iss.warranty}"><div class="row g-2 mb-2"><div class="col-5"><label class="small fw-bold">${l.pri}</label><input type="number" class="form-control price-input" value="${iss.price}" oninput="calculateTotal(this)"></div><div class="col-3 pt-4"><input class="tax-checkbox" type="checkbox" onchange="calculateTotal(this)"><label class="small">+5% Tax</label></div><div class="col-4"><label class="small fw-bold text-danger">${l.total}</label><input type="number" class="form-control total-input text-danger fw-bold bg-white" value="${iss.total}" readonly></div></div><label class="small fw-bold mt-2">單據上傳</label><div class="photo-upload-wrapper"><button type="button" class="btn btn-sm btn-outline-secondary w-100" onclick="triggerPhotoInput(this, 'album')">選擇單據照片</button><input type="file" class="hidden" accept="image/*" multiple onchange="handleMultiPhotoSelect(this)"><div class="preview-gallery"></div></div></div>`;
        }
        
        let sList = isRep ? ["未處理","已聯繫/待派工","已排程","觀察中","已結案"] : ["未處理","處理中","已結案"];
        let pills = sList.map(opt => `<div class="pill-opt ${iss.status===opt?'active':''} ${opt==='已結案'?'pill-status-closed':(opt==='未處理'?'pill-status-pending':'pill-status-progress')}" onclick="selectStatusPill(this, '${opt}')">${statDict[opt]?statDict[opt][currentLang]:opt}</div>`).join('');
        let interact = ''; let cls = isRO ? 'readonly-item' : 'update-item'; let tStat = statDict[iss.status] ? statDict[iss.status][currentLang] : iss.status; let bCls = iss.status==="已結案"?"badge-soft-success":(iss.status!=="未處理"?"badge-soft-warning":"badge-soft-danger"); let sIco = iss.status==="已結案"?"🟢":(iss.status!=="未處理"?"🟡":"🔴");
        
        if (isRO) { interact = `<div class="mt-3 p-3 bg-light rounded"><h6 class="fw-bold text-warning mb-2">🔒 ${l.hqB}</h6><label class="small fw-bold">${l.prog}</label><div class="mb-2">${iss.progress?iss.progress.replace(/\n/g,'<br>'):'-'}</div><span class="badge-soft ${bCls}">${sIco} ${tStat}</span></div>`; } 
        else { hasUpdatable = true; interact = `<label class="fw-bold text-success mt-2">${l.prog}</label><textarea class="form-control progress-input" rows="2">${iss.progress}</textarea>${hqHtml}<label class="fw-bold text-success mt-3">${l.uP} <span class="text-danger">${l.reqC}</span></label><div class="photo-upload-wrapper mb-2"><div class="d-flex gap-2 mb-2"><button type="button" class="btn btn-sm btn-outline-success flex-fill" onclick="triggerPhotoInput(this, 'camera')">📷 拍照</button><button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="triggerPhotoInput(this, 'album')">🖼️ 相簿</button></div><input type="file" class="hidden" accept="image/*" multiple onchange="handleMultiPhotoSelect(this)"><div class="preview-gallery"></div></div><label class="fw-bold text-success mt-3">${l.st}</label><input type="hidden" class="status-input" value="${iss.status}"><div class="segmented-control">${pills}</div>`; }
        
        let k = iss.category.split('/')[0].trim(); let dCat = catDict[k] ? catDict[k][currentLang] : k;
        html += `<div class="${cls} shadow-sm" data-row="${iss.row}" data-sheet="${iss.sheetName}" data-is-repair="${isRep}"><div class="d-flex justify-content-between border-bottom pb-2 mb-2"><div><span class="badge-soft badge-soft-purple me-1">${dCat}</span><h6 class="fw-bold d-inline-block mb-0">${iss.desc}</h6><div class="text-muted small mt-1">ID: ${iss.eventId}</div></div><div class="text-end"><span class="badge-soft ${bCls} mb-1">${sIco} ${tStat}</span><small class="text-muted d-block" style="font-size:0.7rem;">🕒 ${iss.time}</small></div></div>${phtml} ${interact}</div>`;
      });
      document.getElementById('pendingContainer').innerHTML = html; document.getElementById('saveUpdateBtn').classList.toggle('hidden', !hasUpdatable);
      
      issues.forEach(iss => { if (iss.fileId) {
        apiCall('getBase64Photo', { fileId: iss.fileId }).then(b64 => { const c = document.getElementById(`photo-${iss.eventId}`); if (c) c.innerHTML = b64 ? `<img src="${b64}" onclick="openLightbox(this.src)" style="max-width:100%;border-radius:8px;">` : `<div class="text-danger small">${l.errLoad}</div>`; }).catch(() => { const c = document.getElementById(`photo-${iss.eventId}`); if (c) c.innerHTML = `<div class="text-danger small">${l.errLoad}</div>`; });
      }});
    }
    
    async function submitUpdates() {
      const l = i18n[currentLang]; document.getElementById('saveUpdateBtn').disabled = true; const items = document.querySelectorAll('.update-item');
      if (items.length === 0) { document.getElementById('saveUpdateBtn').disabled = false; return; }
      for (let i=0; i<items.length; i++) { if (items[i].querySelector('.status-input').value === '已結案' && (items[i]._photos||[]).length === 0) { showToast(l.reqC, 'error'); document.getElementById('saveUpdateBtn').disabled = false; return; } }
      
      showOverlay("處理中...", 20); const updates = []; const photoUpdates = [];
      for (let i=0; i<items.length; i++) {
        const item = items[i]; const p = item._photos || []; const isR = item.getAttribute('data-is-repair') === 'true';
        let uData = { sheetName: item.getAttribute('data-sheet'), row: item.getAttribute('data-row'), progress: item.querySelector('.progress-input').value, status: item.querySelector('.status-input').value, hasPhoto: p.length>0, isHQ: currentUser.isHQ };
        let mData = null;
        if (isR && currentUser.isHQ) {
          uData.severity = item.querySelector('.severity-input').checked ? "是" : ""; uData.equipName = item.querySelector('.equip-input').value; uData.vendor = item.querySelector('.vendor-input').value; uData.repairDesc = item.querySelector('.repair-desc-input').value; uData.materials = item.querySelector('.materials-input').value; uData.warranty = item.querySelector('.warranty-input').value; uData.price = item.querySelector('.price-input').value; uData.total = item.querySelector('.total-input').value;
          const rW = item.querySelector('.hq-repair-section'); const rP = rW ? (rW._photos || []) : [];
          if (rP.length > 0) { uData.hasReceipt = true; mData = {sheetName:uData.sheetName, row:uData.row}; showOverlay("壓縮單據...", 40); mData.receiptData = await compressImage(rP[0]); }
        }
        updates.push(uData);
        if (p.length > 0) { if(!mData) mData = {sheetName:uData.sheetName, row:uData.row}; showOverlay(`壓縮照片...`, 50); mData.photoData = await compressImage(p[0]); }
        if (mData) photoUpdates.push(mData);
      }
      
      try {
        showOverlay("寫入資料庫...", 70);
        const msg = await apiCall('updateIssuesText', { updates: updates, empName: currentUser.empName });
        if (photoUpdates.length > 0) { showOverlay("上傳更新照片...", 90); await apiCall('uploadUpdatePhotosInBackground', { updates: photoUpdates }); }
        showOverlay("完成！", 100); setTimeout(() => { showToast(msg, 'success'); hideOverlay(); globalPendingData = null; preloadData(); fetchPending(); document.getElementById('saveUpdateBtn').disabled = false; }, 600);
      } catch (e) { document.getElementById('saveUpdateBtn').disabled = false; showError(e); }
    }
  </script>
</body>
</html>
